spec: terminal-productivity
title: Everyday terminal productivity
status: done
created: 2026-10-14
updated: 2026-10-14
goal: Make terminal configuration and saved working environments accessible through native controls.
problem: Settings cover only language and users have one saved layout with limited tab organization.
behavior:
  - Edit language, font, size, opacity, theme and startup behavior with native controls and a reversible preview.
  - Save and reopen named workspaces without terminating existing sessions.
  - Select a named startup workspace or the last saved session.
  - Enable optional recovery snapshots without overwriting manually saved layouts.
  - Duplicate tabs, reopen recently closed tabs and reorder them using mouse and keyboard.
  - Indicate running commands and completed or failed commands in background tabs.
  - Confirm user-requested tab closure with Y or Enter, cancel with N or Escape, and offer mouse buttons.
  - Enable tab close confirmation by default and expose its persistent preference in native settings.
requirements_functional:
  - Preserve existing tab names, working directories, shell profiles and command replay preferences.
  - Never replay commands when duplicating, reopening closed tabs or recovering automatically.
  - Keep configuration imports, comments and unrelated values intact.
  - Keep new controls available in English and Brazilian Portuguese.
constraints:
  - Reuse native renderer and existing dependencies.
  - Keep the installed executable unchanged and do not commit or push.
  - Use mise exec because this checkout has no mise.toml or tasks.
implemented:
  - Native appearance and startup panels with shared hit geometry, live preview, cancel and safe atomic TOML saves.
  - Font family and point size, opacity, complete dark and light palettes and default preference restoration.
  - Private bounded named workspace index with save, open, startup selection and confirmed removal.
  - Scoped startup persistence preserves temporary font and opacity overrides and unrelated configuration.
  - Opt-in independent recovery snapshots for the focused window with change deduplication and suppressed replay.
  - Fresh-shell duplication and recently closed tab reopening with original names and directories.
  - Drag and configurable keyboard reordering preserve terminal state and stable PTY identity.
  - Supported shell completion sequence and status drive running, successful and failed background tab markers.
  - English and Portuguese controls, Unicode editing, clipboard and IME input and responsive compact layouts.
  - Model tests, Bash PTY tests, isolated X11 regressions and user documentation.
  - Default-enabled tab close confirmation with Y and Enter, N and Escape, mouse buttons and safe settings persistence.
  - Stable target identity and isolated modal input, releases and repeats across asynchronous tab exits.
pending:
