acceptance:
  - id: settings
    desc: Native settings preview, cancel and save preserve unrelated configuration and running shells
    status: done
  - id: workspaces
    desc: Named workspaces preserve ordered tabs and support startup selection
    status: done
  - id: recovery
    desc: Optional automatic recovery preserves manual snapshots and does not replay commands
    status: done
  - id: tabs
    desc: Duplicate, reopen and reorder keep session identity and original directories
    status: done
  - id: activity
    desc: Background command activity and completion are visible without changing terminal output
    status: done
  - id: close-confirmation
    desc: Closing a tab requires explicit confirmation while cancellation preserves its running process
    status: done
decisions:
  - Start with everyday configuration and session usability; split panes are a separate future structural feature.
  - Named sessions use one bounded private index rather than user-provided filenames.
  - Recovery is opt-in and uses a separate snapshot; manual layouts remain stable.
  - Duplicating and reopening create fresh shells and do not restore process memory or terminal output.
  - Default startup behavior stays compatible with the existing manually saved layout.
  - Preview applies to the current window; saving applies configuration globally through the existing event loop.
  - Choosing a startup workspace saves only its name and restoration flag so unrelated CLI and IPC appearance overrides remain temporary.
  - An explicit empty startup name overrides imported preferences when returning to the default saved session.
  - Native settings accept 1 to 128 point fonts and 0 to 100 percent opacity to preserve existing useful appearance ranges.
  - Recover only the focused window and retain the last tab layout before final closure; the manual snapshot remains independent.
  - Confirm user tab closure by stable tab identity, including inactive tabs and the final tab; natural shell exits retain their existing behavior.
  - Consume modal input and confirmation key releases so they do not reach another terminal session.
  - Preserve whole-window close semantics and expose general.confirm_tab_close with default true.
risks:
  - Layout changes must share geometry with input hit testing on small windows.
  - Reordering must preserve stable PTY identities and pending replay routing.
  - Shell command activity is available for supported integrated interactive shells.
  - Linux X11 can be exercised locally; Windows and macOS require separate platform validation.
validation:
  - All 371 workspace unit, integration and documentation tests passed.
  - Clippy passed with supported Rust 1.89 across the workspace and all targets.
  - All six isolated X11 regression scripts passed, including actual dragging, background command markers and close confirmation.
  - Preferences preview and cancel preserve the running shell, primary TOML and global settings until saved.
  - Startup selection preserves temporary per-window font and opacity overrides without persisting them.
  - Removing a startup workspace with read-only configuration preserves both files and the startup preference.
  - Recovery retains replay preferences but suppresses execution, preserves the manual snapshot and restores fresh shells after restart.
  - English and Portuguese full panels and 45 by 18 compact layouts were visually inspected.
  - Formatting, structural parsing and git diff checks passed; no commit, push or system binary replacement was performed.
  - Close confirmation X11 covers all entrypoints, both letter cases, final tab, inactive targets, cancellation preserving PIDs and pending target or unrelated exits.
  - Raw Kitty keyboard reporting proves decision key releases and held repeats do not reach surviving terminal sessions.
  - Confirmation preference preview and cancellation preserve the shell; disable, re-enable, save, restart and defaults are verified.
  - Modal handling consumes clipboard paste and file drops and retains IME inhibition when another tab becomes active.
