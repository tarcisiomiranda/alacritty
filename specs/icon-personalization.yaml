spec: icon-personalization
title: Personal terminal icon presets
status: done
created: 2026-11-18
updated: 2026-11-19
goal: Let users choose a predefined terminal icon with preview save cancel and platform-specific desktop integration.
problem: The fixed application icon does not let people give their terminal a personal visual identity.
behavior:
  - Begin with a curated set of static pets and characters with a live preview and an explicit restore-default action.
  - Offer the Yorkie artwork inspired by the user's dog as a separate built-in preset.
  - Display the selected artwork and preset name in a clickable preview on the Appearance page.
  - Distinguish the application launcher icon the running window icon and a companion drawn inside Termust.
  - Keep local photo import and optional animation as later phases.
constraints:
  - The user authorized implementation and subsequently requested release publication commit and push to the existing fork branch.
  - Use primary platform documentation and inspect the current windowing and installer code.
  - Do not promise identical live dock or taskbar behavior across compositors and operating systems.
  - Preserve application identity existing launchers user settings and signed macOS bundles.
implemented:
  - Reviewed fixed window icons desktop entries Windows resources macOS bundle metadata and installer replacement behavior.
  - Recorded the platform capability matrix primary sources proposed architecture phased UX and future validation in docs/plans/2026-11-18-icon-personalization.yaml.
  - Confirmed that the current winit 0.30.13 supports runtime window icons on X11 and Windows but not Wayland or macOS through its generic setter.
  - Added bundled original cat dog fox and robot artwork with portable PNG decoding and English and Portuguese gallery controls.
  - Persisted window.icon through the existing preview save cancel rebase and restore settings flow.
  - Added X11 and Windows runtime window icons and a native AppKit Dock adapter without changing executable or bundle resources.
  - Added per-user Linux launcher and Windows Start menu shortcut customization with original icon restoration.
  - Preserved personalized Linux launcher icons during reinstalls and included embedded icon assets in macOS source releases.
  - Validated graphical interaction on isolated X11 and native builds and workspace tests on Linux and macOS plus a Windows cross-check.
  - Committed the complete buildable Termust checkout as 64a3a8d107856c11c0ecb9105943dae6d9dba441 and pushed the existing fork branch.
  - Published Linux release 0.18.0-termust.64a3a8d1.c9b8aad893e5 to the canonical B2 bucket and both legacy mirrors after all six distro checks and portable icon tests passed.
  - Published the native Apple Silicon archive e1318048641b1497a701ed7f0e007a80bd22b7bde3ce64da83b8f1988e349c4e and updated the common installer and native source builder.
  - Verified anonymous public install reinstall and --check on Linux and macOS using temporary destinations; macOS also passed strict codesign verification without Rust in PATH.
  - Put a clickable thumbnail and the preset name at the top of Appearance above the aligned theme control.
  - Verified the thumbnail and gallery on Linux X11 with compact and high-DPI windows, plus AppKit icon replacement, cancellation, saving and reapplication after restart in a bundled Apple Silicon test build.
  - Published the Appearance preview for Linux x86_64 and macOS Apple Silicon from source commit 0a5a85a8. Verified both updates through the public installer in isolated destinations.
  - Added the Yorkie PNG and multi-resolution Windows ICO. Verified selection, preview, save, and restart on Linux X11 and in an Apple Silicon AppKit fixture. The Linux installer retained the Yorkie launcher settings and Windows passed a cross-check.
  - Published the Yorkie packages from the tested working tree with base revision 75332083. Verified upgrades through the common installer, including the exact Linux binary used for the gallery tests and the saved Yorkie setting in the downloaded Mac app.
pending:
  - Photo import animation and graphical desktop-shell validation remain separate future work.
