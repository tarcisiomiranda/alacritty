spec: macos-apple-silicon
title: Termust tabs panes and settings on Apple Silicon
status: done
created: 2026-11-19
updated: 2026-11-19
goal: Make the macOS binary expose the Termust tab bar pane controls and settings and start the account's configured login shell.
problem: The macOS build disables the Termust tab bar and its shortcuts. The default PTY spawn also prefers an inherited SHELL over the account's login shell, which can hide the expected prompt.
behavior:
  - Show the shared tab bar groups and context menu in each macOS window.
  - Open independent terminal tabs with Command+T and new windows with Command+N.
  - Split right with Command+D and below with Command+Shift+D and expose both actions in the context menu.
  - Open settings with Command+Comma and use the effective bindings in menus and settings.
  - Handle Command+W through the existing tab close confirmation and preserve the F2 key for alternate-screen programs.
  - Use the macOS account's shell for default PTYs and load its interactive login configuration. Honor explicit shell and command overrides.
constraints:
  - Reuse the existing tab pane and dialog implementations and preserve non-macOS bindings.
  - Use isolated test fixtures on the Mac and keep the public installer command and versioned bundle format.
implemented:
  - Compared the installed Apple Silicon app and public latest manifest and confirmed both select the e1318048641b1497a701ed7f0e007a80bd22b7bde3ce64da83b8f1988e349c4e archive.
  - Verified that the public install.sh matches the local file and found the macOS conditions suppressing the toolbar menu and bindings.
  - Verified that a Finder-like launch on the old build loads all four Zsh startup files and a custom PS1 when SHELL is unset. Found that an inherited SHELL takes precedence over the account in the old PTY code.
  - Enabled the shared tab bar, pane menu, and settings with native macOS shortcuts.
  - Changed default macOS PTYs to prefer the shell registered for the account and pass the login command arguments directly.
  - Verified the account's interactive login Zsh and custom PS1 with an unset SHELL and an inherited SHELL pointing to Bash. Explicit per-profile shell and CLI command overrides still launched their configured commands.
  - Published native build 742b8c8 under archive SHA-256 7f088a2515ae39b33ccfc3468163667c5d060cc66593527726e7e30c47963dea and repointed latest-macos-arm64.json.
  - Upgraded an isolated install from 64a3a8d through the public installer with a system-only PATH. Verified the previous bundle, repeat install, signature, ARM64 executable, and Zsh startup with the downloaded binary.
  - Fixed the installer test comparison of the resolved symlink target with macOS temporary paths under /var.
  - Republished build-macos-release.sh on the Mac and verified public source archive SHA-256 fd488c1079509a1cc6718b0217af077d29fcd2c2641e86dcc3d4e3f1364a688c after all 15 release tests passed.
