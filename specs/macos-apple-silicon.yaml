acceptance:
  - desc: Termust uses one visible tab bar and Command+T and Command+N create a tab and a window respectively.
    status: done
  - desc: Both split directions and settings are reachable via shortcuts and the context menu and existing tabs remain active.
    status: done
  - desc: The exact release app is tested and installer version selection is verified on Apple Silicon.
    status: done
  - desc: The native PTY uses the account's Zsh even with an inherited Bash and loads a custom PS1 from .zshrc with login and interactive options active.
    status: done
  - desc: Cmd+Q asks once for every window, and the tab bar never sits under the window buttons with transparent decorations.
    status: done
decisions:
  - Use the Termust tab model for all platforms and disable automatic Cocoa window tabbing.
  - Keep Linux shortcuts and use the Mac Command key for application actions including the conventional Command+D and Command+Shift+D split shortcuts; Duplicate tab uses Command+Shift+E.
  - Use Control+Tab and Command+Shift+brackets for tab cycling so Command+Tab can switch applications.
  - Shift+Cmd+] and Shift+Cmd+[ are bound as "}" and "{" because macOS reports the shifted character for these keys.
  - Reopen closed tab uses Shift+Cmd+T, the common macOS browser shortcut, instead of the Linux Ctrl+Shift+Alt+T.
  - Preserve the macOS login command and allow configured shell and command overrides to use their current arguments.
  - Default macOS shells other than zsh stay without integration; an explicitly configured bash, zsh or fish keeps the existing integration.
  - Application icons in the context menu stay Linux only because they depend on GdkPixbuf.
  - The winit default menu binds Cmd+Q to terminate:, which closed every window before any key binding ran; Termust retargets that menu item instead of removing the menu.
  - Quit confirmation reuses general.confirm_tab_close, so one preference controls every close confirmation; quitting saves the focused window's recovery first.
  - The tab bar sits below the transparent title bar because AppKit drags the window and zooms on double-click in that strip; the height comes from the window's contentLayoutRect.
  - Linux and Windows keep the existing Quit action, which closes only the current window.
  - Quit from the Dock menu or at logout sends terminate: straight to the application and still closes without confirmation.
risks:
  - AppKit input permission may constrain unattended tests that post to the active user session.
