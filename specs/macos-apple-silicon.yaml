spec: macos-apple-silicon
title: Full Termust workflow on macOS Apple Silicon
status: in_progress
created: 2026-11-19
updated: 2026-11-20
goal: Use the same Termust tabs, groups, panes, sessions, shortcuts, desktop actions and agent status on macOS as on Linux, starting the account's configured login shell.
problem: The macOS build disabled the Termust tab bar and its shortcuts, routed tab actions to native window tabs and bound Cmd+W to closing the whole window. The default PTY preferred an inherited SHELL over the account's login shell, the default login shell had no command integration, the menu Quit item closed every window without confirmation and transparent decorations placed the window buttons over the first tab.
behavior:
  - Show the shared tab bar groups and context menu in each macOS window and route tab creation, selection and closing to internal tabs.
  - Disable automatic system window tabbing so Cmd+N windows never merge into a second tab model.
  - Open independent terminal tabs with Command+T and new windows with Command+N.
  - Split right with Command+D and below with Command+Shift+D and expose both actions in the context menu.
  - Open settings with Command+Comma and use the effective bindings in menus and settings.
  - Handle Command+W through the existing tab close confirmation and preserve the F2 key for alternate-screen programs.
  - Label modifiers as Ctrl, Option, Shift and Cmd in settings and menus, while still accepting Alt and Super in saved configuration.
  - Accept Cmd+A, Cmd+V, Cmd+F and Cmd+Enter in Termust dialogs in addition to the Ctrl forms.
  - Use the macOS account's shell for default PTYs and load its interactive login configuration. Honor explicit shell and command overrides.
  - Chain .zshenv, .zprofile, .zshrc and .zlogin through the private integration directory so the default zsh records commands and folders.
  - Detect editor and Finder application bundles and open the pane folder through /usr/bin/open with separate arguments.
  - Skip the /usr/bin/python3 installer stub when no developer tools exist and fall back to Homebrew python3 for agent integration.
  - Route Cmd+Q and the application menu Quit item through one confirmation that names the open tabs and windows, then close every window.
  - Start the tab bar below the window button strip when window.decorations is Transparent or Buttonless.
requirements_functional:
  - Preserve Linux, BSD and Windows shortcuts, menus and session formats.
  - Record commands and working directories from the default zsh without changing the user's startup files.
  - Store no explicit shell in sessions created from the default macOS login shell, so restoration keeps the login flow.
  - Keep all new visible text available in English and Brazilian Portuguese.
constraints:
  - Reuse the existing tab pane and dialog implementations and preserve non-macOS bindings.
  - Use isolated test fixtures on the Mac and keep the public installer command and versioned bundle format.
  - Do not replace the renderer, sign or notarize builds, or publish a release without the user's authorization.
  - Preserve user configuration, saved sessions and the installed Termust.app.
implemented:
  - Compared the installed Apple Silicon app and public latest manifest and confirmed both select the e1318048641b1497a701ed7f0e007a80bd22b7bde3ce64da83b8f1988e349c4e archive.
  - Verified that the public install.sh matches the local file and found the macOS conditions suppressing the toolbar menu and bindings.
  - Verified that a Finder-like launch on the old build loads all four Zsh startup files and a custom PS1 when SHELL is unset. Found that an inherited SHELL takes precedence over the account in the old PTY code.
  - Enabled the shared tab bar, pane menu, and settings with native macOS shortcuts.
  - Changed default macOS PTYs to prefer the shell registered for the account and pass the login command arguments directly.
  - Verified the account's interactive login Zsh and custom PS1 with an unset SHELL and an inherited SHELL pointing to Bash. Explicit per-profile shell and CLI command overrides still launched their configured commands.
  - Published native build 742b8c8 under archive SHA-256 7f088a2515ae39b33ccfc3468163667c5d060cc66593527726e7e30c47963dea and repointed latest-macos-arm64.json.
  - Upgraded an isolated install from 64a3a8d through the public installer with a system-only PATH. Verified the previous bundle, repeat install, signature, ARM64 executable, and Zsh startup with the downloaded binary.
  - Fixed the installer test comparison of the resolved symlink target with macOS temporary paths under /var.
  - Republished build-macos-release.sh on the Mac and verified public source archive SHA-256 fd488c1079509a1cc6718b0217af077d29fcd2c2641e86dcc3d4e3f1364a688c after all 15 release tests passed.
  - Added a test for every macOS tab, pane, settings and window shortcut and bound tab cycling to the shifted bracket characters.
  - Added the Option modifier label and macOS default menu labels.
  - Added the login zsh integration with a .zprofile bridge and a test that runs zsh -l -i against fake startup files.
  - Added application bundle detection for VS Code, Zed, VSCodium, VS Code Insiders, Kate, Sublime Text and Finder.
  - Added the python3 installer stub guard and Homebrew fallback for agent integration.
  - Replaced the /bin/true hook fixture in scripts/test-agent-bridge.py with true so the bridge suite runs on macOS.
  - Retargeted the application menu Quit item to a Termust request, with a close dialog target for quitting and English and Portuguese texts.
  - Reserved the transparent title bar height above the tab bar and ignored tab hits inside that strip.
  - Added scripts/test-macos-gui.py and the mise task test:macos-gui for native graphical checks.
verification:
  - Before the merge with docs/terminal-workspace, mise exec rust@1.89.0 -- cargo test --locked --workspace passed with 488 tests on macOS 26.6.2 arm64 and clippy reported no warnings.
  - python3 -B scripts/test-agent-bridge.py passed 21 tests on macOS.
  - The default zsh started through /usr/bin/login as a login interactive shell with Homebrew PATH, restored ZDOTDIR and recorded the typed command and folder.
  - The context menu opened the pane folder in Finder; F2 with Cmd+A and Cmd+V renamed a tab.
  - python3 -B scripts/test-macos-gui.py passed ten scenarios on macOS 26.6.2 - tabs, panes, windows, quit with and without confirmation, menu Quit, groups surviving SIGKILL, recovery of names, folders, text and split panes after SIGKILL, title bar strip in Full, Transparent and Buttonless, the default login shell and agent permission status through the Claude proxy with a sample agent.
  - In a Linux rust:1.89 container the workspace tests passed except shell_integration bash_reports_executed_commands_without_password_input, which fails the same way on the original copy; clippy reported no warnings.
  - cargo check for x86_64-pc-windows-gnu compiled; its only new warning is the unused ZSH_PROFILE constant, in the same group as the existing unused shell integration constants on Windows.
  - After merging docs/terminal-workspace at fb0dee05, cargo test passed 498 tests on macOS; updates cached_checks_are_scoped_to_the_installed_build_and_manual_checks_bypass_them failed once at its retry_in assertion and passed in three later full runs. Clippy reported no warnings and scripts/test-agent-bridge.py passed 21 tests.
  - After the merge, scripts/test-macos-gui.py passed all ten scenarios with the Cmd+D and Cmd+Shift+D splits, Shift+Cmd+] and Shift+Cmd+[ cycling and the account login shell.
  - After the merge, the Linux rust:1.89 container passed 300 tests with the same bash_reports_executed_commands_without_password_input failure, clippy reported no warnings and cargo check for x86_64-pc-windows-gnu compiled with the same 14 warnings.
pending:
  - Visually check the group selector, the agent overview, the quit dialog and the settings pages on the Mac; screen capture was not available to the automated checks.
  - Check live agent status with a real Claude or Codex session on macOS; the runner uses the sample agent from scripts/test-agents.py.
  - Add screenshot comparison to scripts/test-macos-gui.py once Screen Recording permission is available.
  - Build, package and publish a macOS release that includes the quit confirmation, title bar layout and zsh integration.
