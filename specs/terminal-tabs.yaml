spec: terminal-tabs
title: Native terminal tabs
status: done
created: 2026-10-13
updated: 2026-10-13
goal: Run named terminal tabs and restore saved directories and opted-in recent commands.
problem: Each window currently owns a single PTY and terminal session.
behavior:
  - Show a tab bar with session titles and a button to create a tab.
  - Create a session with Ctrl+Shift+T and close it with Ctrl+Shift+W.
  - Cycle sessions with Ctrl+PageUp and Ctrl+PageDown or select with the mouse.
  - Keep background sessions running and route terminal replies to the originating PTY.
  - Close only the exited session and close the window after the last session exits.
  - Rename a tab using a visible tab settings dialog and keep custom names across shell title updates.
  - Save the ordered tabs, active tab, working directories and recent executed shell commands.
  - Persist a per-tab checkbox to execute its last saved command when restoring the session.
  - Restore saved tabs on normal startup and allow reopening them from the tab settings dialog.
requirements_functional:
  - Separate PTY, terminal grid, selection, scrollback and search state for each tab.
  - Resize every session when the shared window geometry changes.
  - Support configurable tab actions through existing key bindings.
constraints:
  - Reuse the existing OpenGL renderer without adding UI dependencies.
  - Keep existing window creation and IPC behavior.
  - Leave changes in the working tree without commit or push.
implemented:
  - Independent PTYs, terminal grids, selection and search state.
  - Stable terminal event routing and synchronous keyboard and mouse tab actions.
  - Clickable bar with Unicode titles, active-tab visibility and close and create buttons.
  - Asymmetric viewport padding, per-session hold and resizing of all sessions.
  - Unit tests, headless graphical regression tests and usage documentation.
  - Persistent custom names and a native tab settings dialog with a per-tab replay checkbox.
  - Original shell profiles and bounded executed-command records captured through lifecycle hooks.
  - Owner-only atomic snapshots and ordered startup and in-window restoration.
  - Guarded replay from the original command directory through a private source script.
  - Responsive settings panel with dimmed backdrop, explicit fields, graphical checkbox, grouped buttons and hover states.
  - Context menus from right-click in terminal content and tabs or the toolbar, with clipboard and session actions.
  - Stable inactive-tab targets and preserved application mouse reporting with Shift-right-click override.
  - Shared drawing and mouse hit geometry, editable Unicode cursor and non-destructive rejected oversized paste.
pending:
