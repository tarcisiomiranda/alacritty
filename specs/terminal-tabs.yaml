decisions:
  - Implement native tabs in the current source repository.
  - Open a native context menu on right-click in the tab bar and terminal content; Shift-right-click retains access while an application uses terminal mouse reporting.
  - Use a dimmed backdrop, colored panels, bordered inputs, hover states and grouped mouse-operated buttons without a new UI dependency.
  - Keep existing keyboard shortcuts and shell replay behavior while using plain Portuguese labels and explicit session scope.
  - Share the window and renderer while keeping session state independent.
  - Use the configured shell for new tabs and inherit the active working directory when available.
  - No mise.toml or existing specs or implementation plans were found; use mise exec for Rust checks.
  - Preserve native macOS window tabs and enable the custom bar on other platforms.
  - Cancel session timers on activation and ignore already-dispatched events belonging to another session.
  - Apply tab commands synchronously before the next native input event.
  - Store hold per session and keep whole-window close and Quit semantics.
  - System installation is unchanged; use mise exec -- cargo run -p alacritty to run this checkout.
  - Use a manually saved session snapshot so closing tabs does not overwrite the saved layout.
  - Store session data atomically with owner-only permissions under the native user state directory.
  - Capture executed commands using shell lifecycle hooks, without recording raw keyboard or password input.
  - Keep at most 20 recent command records per tab including their original working directories.
  - Execute only the final command of a tab whose replay checkbox was explicitly selected, after its shell is ready.
  - Restore a command from its original directory so relative commands such as cd do not run twice from the final directory.
  - A fresh normal startup restores the snapshot; explicit command, directory or title options keep their requested startup behavior.
  - Reopening a session from the dialog adds its saved tabs without terminating current sessions.
  - Persist only supported interactive Bash, Zsh and Fish profiles and leave custom and login-shell invocations untouched.
  - Execute command bytes from an owner-only script after a successful directory change; do not inject raw control characters into the interactive editor.
  - Poll shell readiness for at most 60 seconds and skip replay when its original directory is absent.
  - Preserve unreadable snapshots or unavailable saved shell profiles and open a usable default terminal with a notice.
risks:
  - Terminal events must retain their session identity to avoid closing or writing to the wrong tab.
  - Shared display state needs invalidation when switching tabs.
  - Graphical validation covers Linux X11; Windows and native macOS behavior were not run locally.
  - Bash hooks and replay have real PTY coverage; Zsh and Fish scripts were not run locally because those shells are unavailable.
  - Snapshots intentionally contain executed command text; Bash history exclusions and disabled history are respected.
  - Commands omitted from capture still mark the shell busy; disabling replay cancels pending execution.
validation:
  - All 306 workspace unit, integration and documentation tests passed with the active Rust toolchain.
  - Headless X11 tests cover shell isolation, cwd, rapid input, PTY replies, resize, mouse and keyboard controls, session exit and hold.
  - Session X11 regression covers custom names, ordered tabs, original working directories, persisted profiles and replay preferences, selected replay, CLI overrides, missing directories, unavailable shells and corrupt snapshots.
  - Native Bash PTY tests verify busy state for history-excluded and history-disabled commands; a delayed-shell X11 regression verifies pending replay cancellation.
  - Formatting checks for edited Rust files and git diff --check passed.
  - UI X11 regression verifies mouse renaming, save and restore menus, inactive-tab actions, copy and paste, dismissal without PTY input, application mouse reporting and a 45-column compact layout.
  - Full, menu and compact screenshots were visually inspected; Clippy passed with Rust 1.89 after the UI changes.
  - Opening overlays cancels terminal selection drags and scrolling timers; inactive-tab selections remain available for copying.
  - Rust 1.97 Clippy stops on preexisting question_mark lints in alacritty_terminal/src/tty/unix.rs; Clippy passed with supported Rust 1.89.
